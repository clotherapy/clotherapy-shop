<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clotherapy Shop</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: #1f2833;
      --card-hover: #2d3846;
      --text-main: #ffffff;
      --text-muted: #c5c6c7;
      --accent: #66fcf1;
      --accent-hover: #45a29e;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      padding-bottom: 90px;
      overflow-x: hidden;
    }

    /* Шапка магазина */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      animation: fadeInDown 0.6s ease;
    }

    .brand-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(45deg, #fff, var(--text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Сетка товаров */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.3s ease;
      animation: fadeInUp 0.5s ease forwards;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 8px 20px rgba(102, 252, 241, 0.15);
    }

    .card-img-placeholder {
      width: 100%;
      height: 130px;
      background: #12181f;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      color: var(--text-muted);
      font-size: 32px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .card-desc {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 10px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
    }

    .price {
      font-size: 15px;
      font-weight: 800;
      color: var(--accent);
    }

    .buy-btn {
      background: var(--accent);
      color: #0b0c10;
      border: none;
      padding: 8px 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .buy-btn:active {
      transform: scale(0.95);
      background: var(--accent-hover);
    }

    /* Анимации появления */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">CLOTHERAPY</div>
    <i class="fa-solid fa-bag-shopping" style="color: var(--accent); font-size: 20px;"></i>
  </header>

  <div class="grid" id="catalog"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Разворачивает приложение на весь экран

    // Список ваших товаров
    const products = [
      { id: 1, name: "Футболка Gucci White", price: "По запросу", desc: "Белая минималистичная футболка Gucci." },
      { id: 2, name: "Лонгслив Skull White", price: "По запросу", desc: "Белый лонгслив с принтом черепа." },
      { id: 3, name: "Футболка Halloween Oct 30", price: "По запросу", desc: "Черная футболка с принтом Halloween." },
      { id: 4, name: "Футболка Undercover", price: "1400 ₽", desc: "Белая футболка с принтом." },
      { id: 5, name: "Andy Warhol Hysteric Glamour", price: "1300 ₽", desc: "Серая футболка двусторонняя." },
      { id: 6, name: "Hysteric Glamour Bear", price: "1450 ₽", desc: "Белая футболка с медведем." },
      { id: 7, name: "Undercover Windbreaker", price: "3500 ₽", desc: "Чоткая зипка с капюшоном." }
    ];

    const container = document.getElementById("catalog");

    products.forEach((prod, index) => {
      const card = document.createElement("div");
      card.className = "card";
      card.style.animationDelay = `${index * 0.08}s`;

      card.innerHTML = `
        <div class="card-img-placeholder">
          <i class="fa-solid fa-shirt"></i>
        </div>
        <div class="card-title">${prod.name}</div>
        <div class="card-desc">${prod.desc}</div>
        <div class="card-bottom">
          <div class="price">${prod.price}</div>
          <button class="buy-btn" onclick="order('${prod.name}')">Купить</button>
        </div>
      `;
      container.appendChild(card);
    });

    function order(productName) {
      // При клике на "Купить" перенаправляет прямо в диалог заказа
      tg.openTelegramLink("https://t.me/clotherapy");
    }
  </script>
</body>
</html>
