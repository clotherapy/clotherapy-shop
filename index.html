<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clotherapy Shop</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: #1f2833;
      --card-hover: #2d3846;
      --text-main: #ffffff;
      --text-muted: #c5c6c7;
      --accent: #66fcf1;
      --accent-hover: #45a29e;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      padding-bottom: 90px;
      overflow-x: hidden;
    }

    /* Шапка магазина */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      animation: fadeInDown 0.6s ease;
    }

    .brand-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(45deg, #fff, var(--text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Сетка товаров */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.3s ease;
      animation: fadeInUp 0.5s ease forwards;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 8px 20px rgba(102, 252, 241, 0.15);
    }

    .card-img-placeholder {
      width: 100%;
      height: 140px;
      background: #12181f;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      color: var(--text-muted);
      font-size: 32px;
      overflow: hidden;
    }

    .card-img-placeholder img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-title {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      line-height: 1.3;
      min-height: 32px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .price {
      font-size: 13px;
      font-weight: 800;
      color: var(--accent);
    }

    .buy-btn {
      background: var(--accent);
      color: #0b0c10;
      border: none;
      padding: 8px 10px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .buy-btn:active {
      transform: scale(0.95);
      background: var(--accent-hover);
    }

    /* Анимации появления */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">CLOTHERAPY</div>
    <i class="fa-solid fa-bag-shopping" style="color: var(--accent); font-size: 20px;"></i>
  </header>

  <div class="grid" id="catalog"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Список всех товаров с готовыми фото
    const products = [
      { id: 1, name: "Gucci Logo-Embroidered T-Shirt", price: "1400 ₴", img: "https://i.postimg.cc/mkQTrgBY/zobrazenna-2026-09-18-141820486.png" },
      { id: 2, name: "Number Nine Birds V-Crewneck T-Shirt", price: "1350 ₴", img: "https://i.postimg.cc/dQ8FrDcy/zobrazenna-2026-09-18-141943615.png" },
      { id: 3, name: "Hysteric Glamour Skullberry White Longsleeve", price: "1550 ₴", img: "https://i.postimg.cc/QM2LWZ6n/zobrazenna-2026-09-18-142025738.png" },
      { id: 4, name: "Andy Warhol by Hysteric Glamour T-Shirt", price: "1350 ₴", img: "https://i.postimg.cc/wTTrMBq6/zobrazenna-2026-09-18-142246939.png" },
      { id: 5, name: "Andy Warhol by Hysteric Glamour Black T-Shirt", price: "1350 ₴", img: "https://i.postimg.cc/GpY7V8QK/zobrazenna-2026-09-18-142312063.png" },
      { id: 6, name: "Undercover T-Shirt", price: "1400 ₴", img: "https://i.postimg.cc/JhbxPwrS/zobrazenna-2026-09-18-142408201.png" },
      { id: 7, name: "Andy Warhol by Hysteric Glamour Grey T-Shirt", price: "1300 ₴", img: "https://i.postimg.cc/c1DmDBWG/zobrazenna-2026-09-18-142438919.png" },
      { id: 8, name: "Hysteric Glamour Grateful Dead Bear T-Shirt", price: "1450 ₴", img: "https://i.postimg.cc/BnFBnWKQ/zobrazenna-2026-09-18-142518554.png" },
      { id: 9, name: "Undercover Chuuut! Windbreaker", price: "3500 ₴", img: "https://i.postimg.cc/5tq58wg5/zobrazenna-2026-09-18-142534759.png" },
      { id: 10, name: "Hysteric Glamour Bear Hys T-Shirt", price: "1500 ₴", img: "https://i.postimg.cc/k4Txpqkv/zobrazenna-2026-09-18-142556840.png" }
    ];

    const container = document.getElementById("catalog");

    products.forEach((prod, index) => {
      const card = document.createElement("div");
      card.className = "card";
      card.style.animationDelay = `${index * 0.05}s`;

      const imgContent = prod.img 
        ? `<img src="${prod.img}" alt="${prod.name}">`
        : `<i class="fa-solid fa-shirt"></i>`;

      card.innerHTML = `
        <div class="card-img-placeholder">
          ${imgContent}
        </div>
        <div class="card-title">${prod.name}</div>
        <div class="card-bottom">
          <div class="price">${prod.price}</div>
          <button class="buy-btn" onclick="order('${prod.name}')">Заказать</button>
        </div>
      `;
      container.appendChild(card);
    });

    function order(productName) {
      tg.openTelegramLink("https://t.me/clotherapy");
    }
  </script>
</body>
</html>
